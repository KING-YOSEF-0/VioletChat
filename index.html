<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>VioletChat · KING_YOSEF_</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div id="app" class="app">
    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <h1 class="logo"><i class="fas fa-comment-dots"></i> VioletChat</h1>
        <p class="sub">where purple meets conversation</p>
        
        <div class="tabs">
          <button type="button" id="loginTab" class="tab active">Log in</button>
          <button type="button" id="signupTab" class="tab">Sign up</button>
        </div>
        
        <!-- LOGIN FORM -->
        <div id="loginForm" class="form">
          <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
          <button type="button" id="loginBtn" class="btn-primary">Log in</button>
        </div>
        
        <!-- SIGNUP FORM -->
        <div id="signupForm" class="form hidden">
          <input type="text" id="signupUsername" placeholder="Choose username" autocomplete="username">
          <input type="text" id="signupDisplay" placeholder="Display name (optional)">
          <input type="password" id="signupPassword" placeholder="Password" autocomplete="new-password">
          <button type="button" id="signupBtn" class="btn-primary">Create account</button>
        </div>
        
        <p class="dev-badge">Developer: <strong>KING_YOSEF_</strong></p>
      </div>
    </div>

    <!-- MAIN SCREEN (Hidden by default, shows after login) -->
    <div id="mainScreen" class="main-screen hidden">
      <aside class="sidebar">
        <div class="profile-header">
          <div class="avatar" id="myAvatar">?</div>
          <div class="my-info">
            <span id="myDisplayName" class="display-name">User</span>
            <span id="myUsername" class="username">@user</span>
          </div>
          <button type="button" id="logoutBtn" class="icon-btn" title="Log out"><i class="fas fa-sign-out-alt"></i></button>
        </div>
      </aside>
      <main class="chat-area">
        <div class="chat-header">
          <h2>Welcome to VioletChat!</h2>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
