<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>VioletChat · KING_YOSEF_</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div id="app" class="app">
    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <h1 class="logo"><i class="fas fa-comment-dots"></i> VioletChat</h1>
        <p class="sub">where purple meets conversation</p>
        
        <div class="tabs">
          <button type="button" id="loginTab" class="tab active">Log in</button>
          <button type="button" id="signupTab" class="tab">Sign up</button>
        </div>
        
        <div id="loginForm" class="form">
          <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
          <button type="button" id="loginBtn" class="btn-primary">Log in</button>
        </div>
        
        <div id="signupForm" class="form hidden">
          <input type="text" id="signupUsername" placeholder="Choose username" autocomplete="username">
          <input type="text" id="signupDisplay" placeholder="Display name (optional)">
          <input type="password" id="signupPassword" placeholder="Password" autocomplete="new-password">
          <button type="button" id="signupBtn" class="btn-primary">Create account</button>
        </div>
        
        <p class="dev-badge">Developer: <strong>KING_YOSEF_</strong></p>
      </div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div id="mainScreen" class="main-screen hidden">
      
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="profile-header">
          <div class="avatar" id="myAvatar">?</div>
          <div class="my-info">
            <span id="myDisplayName" class="display-name">User</span>
            <span id="myUsername" class="username">@user</span>
          </div>
          <button type="button" id="logoutBtn" class="icon-btn" title="Log out"><i class="fas fa-sign-out-alt"></i></button>
        </div>

        <!-- ADD FRIEND SEARCH -->
        <div class="add-friend-bar">
          <input type="text" id="searchUsername" placeholder="Search username…">
          <button type="button" id="addFriendBtn" class="icon-btn"><i class="fas fa-user-plus"></i></button>
        </div>

        <!-- FRIENDS LIST -->
        <div class="friends-list-container">
          <h3 class="section-title"><i class="fas fa-users"></i> Friends</h3>
          <ul id="friendsList" class="friends-list">
            <!-- Friends will appear here -->
          </ul>
        </div>
      </aside>

      <!-- CHAT AREA -->
      <main class="chat-area">
        <div class="chat-header">
          <div class="chat-avatar" id="chatAvatar">?</div>
          <div class="chat-info">
            <span id="chatDisplayName">Select a friend</span>
            <span id="chatStatus" class="status-badge offline">offline</span>
          </div>
        </div>

        <div id="messagesContainer" class="messages-container">
          <div class="empty-chat"><i class="fas fa-comment-slash"></i> Choose a friend to start chatting</div>
        </div>

        <!-- MESSAGE INPUT -->
        <div class="message-input-area hidden" id="messageInputArea">
          <input type="text" id="messageInput" placeholder="Type a message…">
          <button type="button" id="sendBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
          <label for="imageUpload" class="image-label"><i class="fas fa-image"></i></label>
          <input type="file" id="imageUpload" accept="image/*" hidden>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
